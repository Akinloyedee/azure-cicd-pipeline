trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:

- task: Docker@2
  displayName: 'Build and Push Docker Image'
  inputs:
    command: 'buildAndPush'
    repository: 'docker-webserver'
    dockerfile: 'Dockerfile'
    containerRegistry: 'acr-docker-cicd'
    tags: |
      latest

- task: AzureWebAppContainer@1
  displayName: 'Deploy to Azure App Service'
  inputs:
    azureSubscription: 'azure-cicd-connection'
    appName: 'deesaxdockeracr'
    containers: 'deesaxdockeracr.azurecr.io/docker-webserver:latest'
